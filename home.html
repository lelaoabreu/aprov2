<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Principal - Sistema PME</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 800px; width: 100%; margin-top: 50px; }
        
        .cabecalho-sistema { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ccc; padding-bottom: 15px; margin-bottom: 40px; width: 100%; }
        .info-usuario { font-size: 16px; color: #555; }
        .btn-sair { color: #dc3545; text-decoration: none; font-weight: bold; cursor: pointer; }
        .btn-sair:hover { text-decoration: underline; }

        h1 { text-align: center; color: #333; margin-bottom: 40px; }

        /* Estilo dos Cartões do Menu */
        .menu-grid { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .cartao { 
            background: white; 
            padding: 40px 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            text-align: center; 
            flex: 1; 
            min-width: 250px; 
            max-width: 350px; 
            text-decoration: none; 
            color: #333; 
            transition: transform 0.2s, box-shadow 0.2s; 
            border-top: 5px solid #0056b3;
        }
        .cartao:hover { transform: translateY(-5px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        .cartao h2 { margin-bottom: 15px; font-size: 22px; color: #0056b3; }
        .cartao p { font-size: 15px; color: #666; }
        
        /* Cartão de cadastro com cor diferente (opcional) */
        .cartao-cadastro { border-top-color: #28a745; }
        .cartao-cadastro h2 { color: #28a745; }
    </style>
</head>
<body>

<div class="container">
	<div style="text-align: center; margin-bottom: 20px;">
        <img src="logo.png" alt="Logo do Provedor" style="max-height: 70px;">
    <div class="cabecalho-sistema">
        <span class="info-usuario">Olá, <strong id="usuarioLogado">Verificando...</strong></span>
        <a id="btnSair" class="btn-sair">Sair do Sistema</a>
    </div>

    <h1>O que você deseja fazer?</h1>

    <div class="menu-grid">
        <a href="lista.html" class="cartao">
            <h2>🔍 Buscar Clientes</h2>
            <p>Consultar documentações salvas, gerar PDFs e pesquisar circuitos.</p>
        </a>

        <a href="index.html" class="cartao cartao-cadastro">
            <h2>➕ Nova Documentação</h2>
            <p>Cadastrar um novo link PME, dados de rede e evidências de instalação.</p>
        </a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // ⚠️ COLE AQUI AS SUAS CHAVES DO FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyAQz3Eup4L9zBinD3igcJ-bzMp71DHhO3Y",
		  authDomain: "caes-5850d.firebaseapp.com",
		  projectId: "caes-5850d",
		  storageBucket: "caes-5850d.firebasestorage.app",
		  messagingSenderId: "78167199590",
		  appId: "1:78167199590:web:31799b57fb5846130cc2a7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Proteção de Rota - Redireciona para o login se não estiver autenticado
    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('usuarioLogado').innerText = user.email.split('@')[0]; // Mostra só o nome antes do @
        } else {
            window.location.href = "login.html";
        }
    });

    // Sair do sistema
    document.getElementById('btnSair').addEventListener('click', () => {
        signOut(auth).then(() => window.location.href = "login.html");
    });
</script>

</body>
</html>
