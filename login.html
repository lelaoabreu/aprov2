<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito - Documentação PME</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        input:focus { border-color: #0056b3; outline: none; }
        button { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #004494; }
        #mensagemErro { color: red; margin-top: 15px; font-size: 14px; display: none; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Sistema de Ativações</h2>
    <p style="color: #666; margin-bottom: 20px;">Faça login para acessar a documentação.</p>
    
    <form id="loginForm">
        <div class="form-group">
            <label for="email">E-mail Corporativo</label>
            <input type="email" id="email" required placeholder="tecnico@provedor.com.br">
        </div>
        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" required placeholder="Sua senha de acesso">
        </div>
        
        <button type="submit" id="btnEntrar">Entrar no Sistema</button>
        <p id="mensagemErro">E-mail ou senha incorretos.</p>
    </form>
</div>

<script type="module">
    // Importa o app principal e o módulo de autenticação
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // SUBSTITUA ESTE BLOCO PELAS SUAS CHAVES DO FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyAQz3Eup4L9zBinD3igcJ-bzMp71DHhO3Y",
	authDomain: "caes-5850d.firebaseapp.com",
	projectId: "caes-5850d",
	storageBucket: "caes-5850d.firebasestorage.app",
	messagingSenderId: "78167199590",
	appId: "1:78167199590:web:31799b57fb5846130cc2a7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById('loginForm').addEventListener('submit', async function(event) {
        event.preventDefault();
        
        const btnEntrar = document.getElementById('btnEntrar');
        const erroMsg = document.getElementById('mensagemErro');
        
        btnEntrar.disabled = true;
        btnEntrar.innerText = "Autenticando...";
        erroMsg.style.display = 'none';

        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;

        try {
            // Tenta fazer o login no Firebase
            await signInWithEmailAndPassword(auth, email, senha);
            
            // Se der certo, redireciona o técnico para o formulário de cadastro
            window.location.href = "home.html";
        } catch (erro) {
            console.error("Erro no login:", erro);
            erroMsg.style.display = 'block';
            erroMsg.innerText = "E-mail ou senha inválidos. Tente novamente.";
            btnEntrar.disabled = false;
            btnEntrar.innerText = "Entrar no Sistema";
        }
    });
</script>

</body>
</html>
